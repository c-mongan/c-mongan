<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
<title id="title">Conor Mongan, Member of Technical Staff</title>
<desc id="desc">An editorial service-engineering signal trace moving from observation to diagnosis and improvement.</desc>
